# Blueprint do Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: enseada
    runtime: docker
    plan: starter          # o plano gratuito não tem disco permanente (os dados seriam apagados)
    region: virginia
    healthCheckPath: /healthz
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/enseada.db
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
